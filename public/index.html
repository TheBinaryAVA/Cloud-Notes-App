<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cloud Notes</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>☁️ Cloud Notes</h1>
    </header>

    <main>
      <section class="form-container">
        <h2 id="form-title">Create Note</h2>
        <form id="note-form">
          <input type="hidden" id="note-id">
          <input type="text" id="note-title" placeholder="Note Title" required>
          <textarea id="note-content" placeholder="Write your note here..." rows="4" required></textarea>
          <div class="button-group">
            <button type="submit" id="save-btn">Save Note</button>
            <button type="button" id="cancel-btn" class="hidden">Cancel Edit</button>
          </div>
        </form>
      </section>

      <section class="notes-container">
        <h2>Your Notes</h2>
        <div id="notes-grid" class="grid"></div>
      </section>
    </main>
  </div>
  <script src="app.js"></script>
</body>
</html>
