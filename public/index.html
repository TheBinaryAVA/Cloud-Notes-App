<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Whispers in the Cloud</title>
  <!-- Google Fonts: Inter for readability, Cormorant Garamond for elegant serifs -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,700;1,500&family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="background-overlay"></div>
  
  <div class="wrapper">
    <header class="main-header">
      <h1 class="logo-text">Whispers in the Cloud</h1>
      <p class="subtitle">A secure place for your thoughts</p>
    </header>

    <div class="main-content">
      <section class="composition-area">
        <div class="paper-page">
          <h2 id="form-title">New Entry</h2>
          <form id="note-form">
            <input type="hidden" id="note-id">
            <input type="text" id="note-title" class="entry-title-input" placeholder="Title your thought..." required>
            <div class="lined-paper">
              <textarea id="note-content" class="entry-content-input" placeholder="Start writing here..." required></textarea>
            </div>
            <div class="action-bar">
              <button type="submit" id="save-btn" class="btn-primary">Commit to Memory</button>
              <button type="button" id="cancel-btn" class="btn-secondary hidden">Discard Changes</button>
            </div>
          </form>
        </div>
      </section>

      <section class="journal-entries">
        <div class="entries-header">
          <h2>Past Reflections</h2>
        </div>
        <div id="notes-grid" class="notes-stack"></div>
      </section>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
